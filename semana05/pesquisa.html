<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício semana 5, formulário</title>
    <meta name="description" content="Realizar um formulário de pesquisa"/>
    <meta name="author" content="Vinicius de Oliveira Collaço" />
</head>
<body>
    <header>
        <h1>WDD 130 | Formulário HTML - Enquete do Usuário</h1>
    </header>
    
    <main>
        <form>
            <fieldset>
                <legend>Informações de Contato</legend>
                <br>
                <label for="nome-completo">Nome Completo:</label>
                <input type="text" id="nome-completo" name="nome-completo" required>
                <br><br>
                <label for="emaildousuario">Email:</label>
                <input type="email" id="emaildousuario" name="emaildousuario" required>
                <br>
            </fieldset>

            <br>

            <fieldset>
                <legend>Perguntas</legend>
                <br>
                <label for="navegador">Qual é o seu navegador de internet favorito?</label>
                <select name="navegador" id="navegador">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="brave">Brave</option>
                </select>
                <br><br>
                
                <label for="pet">Você tem um animal de estimação?</label>
                <input type="checkbox" id="pet" name="pet">
                <br><br>
                
                <label for="feedback">Liste os lugares onde você morou:</label>
                <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Flórida,&#10;Amsterdam Holanda,&#10;Tibuktu Mali"></textarea>
                <br>
            </fieldset>

            <br>
            <button type="submit">Enviar Enquete</button>
        </form>
    </main>

    <br>
    <footer>
        <p>&copy;2026 | Formulário HTML - Atividade de Enquete do Usuário | Vinicius de Oliveira Collaço/p>
    </footer>
</body>
</html>
